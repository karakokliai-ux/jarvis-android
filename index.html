<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b18">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#050b18;color:#e8f5ff;
font-family:Arial,sans-serif;min-height:100vh;
display:flex;justify-content:center;align-items:center;
}
.app{width:100%;max-width:650px;padding:22px}
header{text-align:center;padding:25px 0}
.logo{
width:115px;height:115px;border-radius:50%;
border:2px solid #00d9ff;
margin:auto;display:flex;align-items:center;
justify-content:center;font-size:37px;
color:#00d9ff;box-shadow:0 0 35px #00bfff55;
}
h1{letter-spacing:7px;color:#00d9ff;margin-bottom:5px}
.status{color:#8ba9bd;font-size:13px}
.chat{
height:340px;overflow-y:auto;
border:1px solid #16405b;border-radius:15px;
padding:15px;background:#091526;
}
.message{padding:12px;margin:10px 0;
border-radius:12px;line-height:1.6}
.bot{background:#102c43;color:#b9ecff}
.user{background:#123d50;color:white}
.controls{display:flex;gap:9px;margin-top:15px}
input{
flex:1;min-width:0;background:#102034;
border:1px solid #1c5874;border-radius:10px;
padding:14px;color:white;font-size:16px;
}
button{
background:#00bfe9;color:#00121d;border:0;
border-radius:10px;padding:13px 17px;
font-weight:bold;font-size:15px;cursor:pointer;
}
.mic{width:100%;margin-top:12px;background:#123e58;color:#fff}
footer{text-align:center;color:#56778c;font-size:12px;margin-top:25px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">J</div>
<h1>J.A.R.V.I.S</h1>
<div class="status" id="status">מערכת פעילה | ממתין לפקודה</div>
</header>
<div class="chat" id="chat">
<div class="message bot">
שלום. אני JARVIS.<br>
המערכת מוכנה לפקודות שלך. במה אוכל לעזור?
</div>
</div>
<div class="controls">
<input id="question" placeholder="כתוב פקודה ל-JARVIS...">
<button onclick="send()">שלח</button>
</div>
<button class="mic" onclick="listen()">🎙️ הפעלה קולית</button>
<footer>JARVIS AI | גרסה ראשונית</footer>
</div>
<script>
const chat=document.getElementById('chat');
const status=document.getElementById('status');

function addMessage(text,type){
const div=document.createElement('div');
div.className='message '+type;
div.textContent=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

function speak(text){
if(!('speechSynthesis' in window))return;
speechSynthesis.cancel();
const utterance=new SpeechSynthesisUtterance(text);
utterance.lang='he-IL';
utterance.rate=0.95;
speechSynthesis.speak(utterance);
}

function answer(q){
const t=q.toLowerCase();
if(t.includes('שלום'))return 'שלום לך. שמח לשמוע ממך.';
if(t.includes('שמך')||t.includes('מי אתה'))return 'אני JARVIS, העוזר האישי שלך.';
if(t.includes('שעה'))return 'השעה כעת '+new Date().toLocaleTimeString('he-IL');
if(t.includes('תאריך'))return 'היום '+new Date().toLocaleDateString('he-IL');
if(t.includes('תודה'))return 'בשמחה. אני כאן בשבילך.';
return 'קיבלתי את הפקודה: '+q+'. כרגע אני פועל בגרסה ראשונית. חיבור למוח AI מתקדם יתווסף בשלב הבא.';
}

function send(){
const input=document.getElementById('question');
const q=input.value.trim();
if(!q)return;
addMessage(q,'user');
input.value='';
const a=answer(q);
setTimeout(()=>{
addMessage(a,'bot');
speak(a);
},300);
}

document.getElementById('question').addEventListener('keydown',e=>{
if(e.key==='Enter')send();
});

function listen(){
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SpeechRecognition){
addMessage('זיהוי קולי אינו נתמך בדפדפן הזה. נסה Chrome.','bot');
return;
}
const recognition=new SpeechRecognition();
recognition.lang='he-IL';
recognition.interimResults=false;
status.textContent='מקשיב לך עכשיו...';
recognition.onresult=e=>{
document.getElementById('question').value=e.results[0][0].transcript;
status.textContent='הפקודה התקבלה';
send();
};
recognition.onerror=()=>{
status.textContent='לא הצלחתי לזהות. נסה שוב.';
};
recognition.onend=()=>{
if(status.textContent==='מקשיב לך עכשיו...')status.textContent='מערכת פעילה';
};
recognition.start();
}
</script>
</body>
</html>
